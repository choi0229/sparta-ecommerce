# 부하 측정 전용 격리 환경. 프로젝트 이름이 sparta-loadtest라 기본 docker compose 환경과 컨테이너·볼륨을 공유하지 않는다.
# 볼륨은 익명 볼륨이므로 `docker compose -f loadtest/env/compose.yml down -v`로 이 환경의 데이터만 지운다.
# 포트: product-db 15433, inventory-db 15434, order-db 15435, Kafka 19092 (호스트에서 실행하는 서비스용)
name: sparta-loadtest
services:
  product-db:
    image: postgres:16
    environment: {POSTGRES_DB: productdb, POSTGRES_USER: root, POSTGRES_PASSWORD: rootpassword}
    ports: ["15433:5432"]
  inventory-db:
    image: postgres:16
    environment: {POSTGRES_DB: inventorydb, POSTGRES_USER: root, POSTGRES_PASSWORD: rootpassword}
    ports: ["15434:5432"]
  order-db:
    image: postgres:16
    environment: {POSTGRES_DB: orderdb, POSTGRES_USER: root, POSTGRES_PASSWORD: rootpassword}
    ports: ["15435:5432"]
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    environment: {ZOOKEEPER_CLIENT_PORT: 2181, ZOOKEEPER_TICK_TIME: 2000}
  kafka:
    image: confluentinc/cp-kafka:7.3.0
    depends_on: [zookeeper]
    ports: ["19092:19092"]
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:19092,INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:19092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
