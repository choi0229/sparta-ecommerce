global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts/logistics-outbox-alerts.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'spring-boot'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 5s
    static_configs:
      - targets:
          #- 'product-api:8081'
          #- 'inventory-api:8082'
          #- 'order-api:8083'
          - 'host.docker.internal:8081' # product-api
          - 'host.docker.internal:8082' # inventory-api
          - 'host.docker.internal:8083' # order-api
          - 'host.docker.internal:8084' # logistics-api