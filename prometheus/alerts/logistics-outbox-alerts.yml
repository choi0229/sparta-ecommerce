groups:
  - name: logistics-outbox
    rules:

      # FAILED 이벤트 존재 — 수동 트리아지 필요
      - alert: LogisticsOutboxFailedEventsPresent
        expr: logistics_outbox_events{status="FAILED"} >= 1
        for: 5m
        labels:
          severity: warning
          service: logistics-api
        annotations:
          summary: "Logistics Outbox FAILED 이벤트 존재"
          description: >
            logistics_outbox_events{status="FAILED"} = {{ $value }}.
            FAILED row가 5분 이상 지속됩니다.
            GET /admin/outbox?status=FAILED 로 확인 후 원인 분석 및 재처리 여부 판단하세요.
            runbook: docs/runbooks/logistics-outbox-alerts.md#LogisticsOutboxFailedEventsPresent

      # FAILED 이벤트 급증 — 즉시 대응 필요
      - alert: LogisticsOutboxFailedEventsSurge
        expr: logistics_outbox_events{status="FAILED"} >= 5
        for: 5m
        labels:
          severity: critical
          service: logistics-api
        annotations:
          summary: "Logistics Outbox FAILED 이벤트 급증"
          description: >
            logistics_outbox_events{status="FAILED"} = {{ $value }}.
            FAILED row가 5건 이상 5분 유지됩니다.
            Kafka 연결 상태, eventType 오류, topic 미존재 여부를 즉시 확인하세요.
            runbook: docs/runbooks/logistics-outbox-alerts.md#LogisticsOutboxFailedEventsSurge

      # 발행 실패 카운터 증가 — publisher 오류 감지
      - alert: LogisticsOutboxPublishErrorsDetected
        expr: increase(logistics_outbox_publish_total{result="failed"}[5m]) >= 3
        for: 2m
        labels:
          severity: warning
          service: logistics-api
        annotations:
          summary: "Logistics Outbox 발행 실패 감지"
          description: >
            최근 5분간 logistics_outbox_publish{result="failed"} 증가량 = {{ $value }}.
            Kafka send 실패가 반복되고 있습니다.
            Kafka 브로커 상태 및 topic 존재 여부를 확인하세요.
            runbook: docs/runbooks/logistics-outbox-alerts.md#LogisticsOutboxPublishErrorsDetected

      # 발행 실패 급증 — 심각한 Kafka 장애 가능성
      - alert: LogisticsOutboxPublishErrorsSurge
        expr: increase(logistics_outbox_publish_total{result="failed"}[5m]) >= 10
        for: 2m
        labels:
          severity: critical
          service: logistics-api
        annotations:
          summary: "Logistics Outbox 발행 실패 급증"
          description: >
            최근 5분간 logistics_outbox_publish{result="failed"} 증가량 = {{ $value }}.
            Kafka 장애 또는 topic 설정 오류 가능성이 높습니다. 즉시 확인하세요.
            runbook: docs/runbooks/logistics-outbox-alerts.md#LogisticsOutboxPublishErrorsSurge

      # stale PROCESSING 이벤트 중 고재시도 row 감지
      - alert: LogisticsOutboxHighRetryEventsDetected
        expr: increase(logistics_outbox_stale_high_retry_total[10m]) > 0
        for: 1m
        labels:
          severity: warning
          service: logistics-api
        annotations:
          summary: "Logistics Outbox 고재시도 Stale 이벤트 감지"
          description: >
            최근 10분간 logistics_outbox_stale_high_retry 증가량 = {{ $value }}.
            retry_count >= 3 인 PROCESSING 이벤트가 만료 후 재복구되고 있습니다.
            반복 실패 원인(Kafka, eventType, payload)을 확인하세요.
            runbook: docs/runbooks/logistics-outbox-alerts.md#LogisticsOutboxHighRetryEventsDetected

      # stale 복구가 지속적으로 발생 — publisher 불안정 가능성
      - alert: LogisticsOutboxStaleRecoveryFrequent
        expr: increase(logistics_outbox_stale_recovered_total[5m]) > 5
        for: 10m
        labels:
          severity: warning
          service: logistics-api
        annotations:
          summary: "Logistics Outbox Stale 복구 빈번 발생"
          description: >
            최근 5분간 logistics_outbox_stale_recovered 증가량 = {{ $value }}.
            publisher가 claim 후 완료 처리 없이 자주 종료되고 있을 수 있습니다.
            publisher 프로세스 안정성 및 JVM GC 영향을 확인하세요.
            runbook: docs/runbooks/logistics-outbox-alerts.md#LogisticsOutboxStaleRecoveryFrequent
