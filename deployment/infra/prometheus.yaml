apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/logistics-outbox-alerts.yml

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'spring-boot'
        metrics_path: '/actuator/prometheus'
        scrape_interval: 5s
        static_configs:
          - targets:
              - 'product-api-svc.ecommerce.svc.cluster.local:8081'
              - 'inventory-api-svc.ecommerce.svc.cluster.local:8082'
              - 'order-api-svc.ecommerce.svc.cluster.local:8083'
              - 'logistics-api-svc.ecommerce.svc.cluster.local:8084'

  logistics-outbox-alerts.yml: |
    groups:
      - name: logistics-outbox
        rules:
          - alert: LogisticsOutboxFailedEventsPresent
            expr: logistics_outbox_events{status="FAILED"} >= 1
            for: 5m
            labels:
              severity: warning
              service: logistics-api
            annotations:
              summary: "Logistics Outbox FAILED 이벤트 존재"
              description: "FAILED row가 5분 이상 지속됩니다."

          - alert: LogisticsOutboxFailedEventsSurge
            expr: logistics_outbox_events{status="FAILED"} >= 5
            for: 5m
            labels:
              severity: critical
              service: logistics-api
            annotations:
              summary: "Logistics Outbox FAILED 이벤트 급증"
              description: "FAILED row가 5건 이상 5분 유지됩니다."

          - alert: LogisticsOutboxPublishErrorsDetected
            expr: increase(logistics_outbox_publish_total{result="failed"}[5m]) >= 3
            for: 2m
            labels:
              severity: warning
              service: logistics-api
            annotations:
              summary: "Logistics Outbox 발행 실패 감지"
              description: "최근 5분간 publish failed 증가량이 3 이상입니다."

          - alert: LogisticsOutboxPublishErrorsSurge
            expr: increase(logistics_outbox_publish_total{result="failed"}[5m]) >= 10
            for: 2m
            labels:
              severity: critical
              service: logistics-api
            annotations:
              summary: "Logistics Outbox 발행 실패 급증"
              description: "최근 5분간 publish failed 증가량이 10 이상입니다."

          - alert: LogisticsOutboxHighRetryEventsDetected
            expr: increase(logistics_outbox_stale_high_retry_total[10m]) > 0
            for: 1m
            labels:
              severity: warning
              service: logistics-api
            annotations:
              summary: "Logistics Outbox high-retry stale 이벤트 감지"
              description: "retry_count >= 3 stale recovery가 감지되었습니다."

          - alert: LogisticsOutboxStaleRecoveryFrequent
            expr: increase(logistics_outbox_stale_recovered_total[5m]) > 5
            for: 10m
            labels:
              severity: warning
              service: logistics-api
            annotations:
              summary: "Logistics Outbox stale recovery 빈발"
              description: "5분 동안 stale recovery가 5건 초과로 10분 지속됩니다."

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
      nodePort: 30090