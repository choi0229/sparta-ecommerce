apiVersion: v1
kind: Service
metadata:
  name: logstash
  namespace: ecommerce
spec:
  selector:
    app: logstash
  type: ClusterIP
  ports:
    - name: tcp-5001
      port: 5001
      targetPort: 5001
      protocol: TCP
    - name: udp-5001
      port: 5001
      targetPort: 5001
      protocol: UDP