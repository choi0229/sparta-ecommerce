name: Claude CI Gate

on:
  push:
    branches: [main, master, dev-logitical]
  pull_request:
    branches: [main, master, dev-logitical]

jobs:
  guardrails:
    name: Claude Guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Run guardrails
        run: |
          chmod +x scripts/claude-guardrails.sh
          bash scripts/claude-guardrails.sh

  logistics-api-test:
    name: logistics-api Tests
    runs-on: ubuntu-latest
    needs: guardrails
    defaults:
      run:
        working-directory: logistics-api

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logistics-api-test-results
          path: logistics-api/build/reports/tests/test/

  logistics-api-build:
    name: logistics-api Build
    runs-on: ubuntu-latest
    needs: logistics-api-test
    defaults:
      run:
        working-directory: logistics-api

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build bootJar
        run: ./gradlew bootJar -x test
