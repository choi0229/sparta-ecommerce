name: Claude CI Gate

on:
  push:
    branches: [main, master, dev-logistical]
  pull_request:
    branches: [main, master, dev-logistical]

jobs:
  guardrails:
    name: Claude Guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Run guardrails
        run: |
          chmod +x scripts/claude-guardrails.sh
          bash scripts/claude-guardrails.sh

  unit-test:
    name: ${{ matrix.service }} Tests
    runs-on: ubuntu-latest
    needs: guardrails
    strategy:
      fail-fast: false
      matrix:
        service: [product-api, order-api, inventory-api, logistics-api]
    defaults:
      run:
        working-directory: ${{ matrix.service }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run tests (${{ matrix.service }})
        run: ./gradlew test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-test-results
          path: ${{ matrix.service }}/build/reports/tests/test/

  logistics-api-build:
    name: logistics-api Build
    runs-on: ubuntu-latest
    needs: unit-test
    defaults:
      run:
        working-directory: logistics-api

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build bootJar
        run: ./gradlew bootJar -x test
