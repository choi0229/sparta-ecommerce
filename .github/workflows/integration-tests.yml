# Integration tests require Docker (Testcontainers). Run manually via workflow_dispatch.
name: Integration Tests

on:
  workflow_dispatch:

jobs:
  logistics-api-integration-test:
    name: logistics-api Integration Tests (Docker/Testcontainers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: logistics-api

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run integration tests (requires Docker)
        run: ./gradlew integrationTest

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logistics-api-integration-test-results
          path: logistics-api/build/reports/tests/integrationTest/

  order-api-integration-test:
    name: order-api Integration Tests (Docker/Testcontainers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: order-api

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run integration tests (requires Docker)
        run: ./gradlew integrationTest

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: order-api-integration-test-results
          path: order-api/build/reports/tests/integrationTest/
