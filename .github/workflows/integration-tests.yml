name: Integration Tests

on:
  workflow_dispatch:
    inputs:
      service:
        description: '테스트할 서비스 (all = 전체 병렬 실행)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - product-api
          - order-api
          - inventory-api
          - logistics-api

jobs:
  integration-test:
    name: ${{ matrix.service }} Integration Tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(
          inputs.service == 'all'
          && '["product-api","order-api","inventory-api","logistics-api"]'
          || format('["{0}"]', inputs.service)
          ) }}

    defaults:
      run:
        working-directory: ${{ matrix.service }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run service tests — ${{ matrix.service }}
        run: |
          if [[ "${{ matrix.service }}" == "order-api" || "${{ matrix.service }}" == "logistics-api" ]]; then
            echo "[INFO] integrationTest 실행"
            ./gradlew integrationTest
          else
            echo "[INFO] integrationTest task 없음 → test 실행"
            ./gradlew test
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-test-results
          path: |
            ${{ matrix.service }}/build/reports/tests/test/
            ${{ matrix.service }}/build/reports/tests/integrationTest/
          if-no-files-found: ignore