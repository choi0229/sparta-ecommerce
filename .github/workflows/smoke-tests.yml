# Smoke tests connect to localhost:8083 (order-api) and localhost:8084 (logistics-api).
# This workflow manages kubectl port-forward lifecycle automatically.
# Requires a self-hosted runner with kubectl access to the cluster.
# See docs/runbooks/smoke-test-runner-setup.md for runner setup prerequisites.
name: Smoke Tests

on:
  workflow_dispatch:
    inputs:
      target:
        description: '실행할 smoke test 대상 (happy / negative / address-http / all)'
        required: true
        default: 'all'
        type: choice
        options:
          - happy
          - negative
          - address-http
          - all

jobs:
  smoke-test:
    name: Smoke Tests (${{ inputs.target }})
    if: ${{ inputs.target == 'happy' || inputs.target == 'negative' || inputs.target == 'all' }}
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 로그 디렉터리 생성
        run: mkdir -p logs

      - name: '[Preflight] 도구 및 클러스터 접근 확인'
        run: |
          set -euo pipefail

          echo "── 도구 확인 ──────────────────────────────────────────────────"
          if command -v kubectl &>/dev/null; then
            echo "[OK] kubectl"
          else
            echo "[FAIL] kubectl 미설치 — runner에 kubectl이 설치되어 있어야 합니다"
            exit 1
          fi

          if command -v curl &>/dev/null; then
            echo "[OK] curl"
          else
            echo "[FAIL] curl 미설치"
            exit 1
          fi

          if command -v jq &>/dev/null; then
            echo "[OK] jq"
          else
            echo "[WARN] jq 미설치 — smoke script가 grep/sed fallback으로 동작합니다"
          fi

          echo ""
          echo "── 클러스터 접근 확인 ──────────────────────────────────────────"
          if ! kubectl cluster-info --request-timeout=5s &>/dev/null; then
            echo "[FAIL] 클러스터 접근 불가"
            echo "       KUBECONFIG 경로 또는 클러스터 상태를 확인하세요"
            echo "       수동 점검: kubectl cluster-info"
            exit 1
          fi
          kubectl cluster-info --request-timeout=5s 2>/dev/null | head -1
          echo "[OK] 클러스터 접근 확인"

          echo ""
          echo "── 서비스 존재 확인 (namespace: ecommerce) ────────────────────"
          for svc in order-api-svc logistics-api-svc; do
            if kubectl get svc "$svc" -n ecommerce &>/dev/null; then
              echo "[OK] svc/${svc}"
            else
              echo "[FAIL] svc/${svc} 를 ecommerce 네임스페이스에서 찾을 수 없습니다"
              echo "       수동 점검: kubectl get svc -n ecommerce"
              exit 1
            fi
          done

      - name: '[Port-forward] order-api:8083, logistics-api:8084 시작'
        run: |
          set -euo pipefail

          echo "── 포트 선점 확인 ────────────────────────────────────────────"
          for port in 8083 8084; do
            if (echo >/dev/tcp/localhost/${port}) 2>/dev/null; then
              echo "[FAIL] Port ${port} 가 이미 사용 중입니다"
              echo "       이전 실행의 port-forward 또는 로컬 프로세스를 종료하세요"
              echo "       확인: lsof -i :${port} 또는 ss -tlnp | grep ${port}"
              exit 1
            fi
          done
          echo "[OK] 포트 8083, 8084 사용 가능"

          echo ""
          kubectl port-forward svc/order-api-svc 8083:8083 -n ecommerce &
          PF_ORDER_PID=$!
          echo "PF_ORDER_PID=${PF_ORDER_PID}" >> "$GITHUB_ENV"

          kubectl port-forward svc/logistics-api-svc 8084:8084 -n ecommerce &
          PF_LOGISTICS_PID=$!
          echo "PF_LOGISTICS_PID=${PF_LOGISTICS_PID}" >> "$GITHUB_ENV"

          echo "order-api port-forward PID=${PF_ORDER_PID}"
          echo "logistics-api port-forward PID=${PF_LOGISTICS_PID}"

          echo ""
          echo "── 포트 응답 대기 ────────────────────────────────────────────"
          for port in 8083 8084; do
            elapsed=0
            until curl -sf "http://localhost:${port}/actuator/health" -o /dev/null; do
              sleep 1
              elapsed=$((elapsed + 1))
              echo "  [${elapsed}s] localhost:${port} 대기 중..."
              if [[ $elapsed -ge 20 ]]; then
                echo "[FAIL] localhost:${port} 이 20초 내에 응답하지 않습니다"
                echo "── pod 상태 ──────────────────────────────────────────"
                kubectl get pods -n ecommerce --no-headers 2>/dev/null || true
                exit 1
              fi
            done
            echo "[OK] localhost:${port} 응답 확인"
          done

      - name: Grant execute permission for smoke scripts
        run: chmod +x scripts/smoke/e2e-order-shipment-smoke.sh scripts/smoke/e2e-order-invalid-sku-smoke.sh

      - name: '[happy] order 생성 → shipmentStatus=READY/SHIPPED 검증'
        if: ${{ inputs.target == 'happy' || inputs.target == 'all' }}
        run: |
          set -o pipefail
          bash scripts/smoke/e2e-order-shipment-smoke.sh 2>&1 | tee logs/smoke-happy.log

      - name: '[negative] invalid SKU → status=FAILED, MISSING_SKU 검증'
        if: ${{ inputs.target == 'negative' || inputs.target == 'all' }}
        run: |
          set -o pipefail
          bash scripts/smoke/e2e-order-invalid-sku-smoke.sh 2>&1 | tee logs/smoke-negative.log

      - name: '[Teardown] port-forward 프로세스 종료'
        if: always()
        run: |
          kill "${PF_ORDER_PID:-}" 2>/dev/null \
            && echo "[OK] order-api port-forward 종료" \
            || echo "[SKIP] PF_ORDER_PID 없음 (preflight 단계에서 실패했을 수 있습니다)"
          kill "${PF_LOGISTICS_PID:-}" 2>/dev/null \
            && echo "[OK] logistics-api port-forward 종료" \
            || echo "[SKIP] PF_LOGISTICS_PID 없음"

      - name: 'smoke 결과 artifact 업로드'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs-${{ inputs.target }}-${{ github.run_id }}
          path: logs/
          if-no-files-found: ignore

  address-http-smoke:
    name: Address HTTP Smoke (${{ inputs.target }})
    # smoke-test 이 skipped 인 경우(target=address-http)에도 실행되도록 always() 사용.
    # smoke-test 가 failure 인 경우(cluster 장애 등)에는 실행하지 않음.
    if: ${{ always() && (inputs.target == 'address-http' || inputs.target == 'all') && (needs.smoke-test.result != 'failure') }}
    needs: smoke-test
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 로그 디렉터리 생성
        run: mkdir -p logs

      - name: '[Preflight] 도구 및 클러스터 접근 확인'
        run: |
          set -euo pipefail

          echo "── 도구 확인 ──────────────────────────────────────────────────"
          for cmd in docker minikube kubectl curl; do
            if command -v "$cmd" &>/dev/null; then
              echo "[OK] $cmd"
            else
              echo "[FAIL] $cmd 미설치 — runner에 $cmd 이(가) 설치되어 있어야 합니다"
              exit 1
            fi
          done

          if command -v jq &>/dev/null; then
            echo "[OK] jq"
          else
            echo "[WARN] jq 미설치 — smoke script가 grep/sed fallback으로 동작합니다"
          fi

          echo ""
          echo "── 클러스터 접근 확인 ──────────────────────────────────────────"
          if ! kubectl cluster-info --request-timeout=5s &>/dev/null; then
            echo "[FAIL] 클러스터 접근 불가"
            echo "       KUBECONFIG 경로 또는 클러스터 상태를 확인하세요"
            echo "       수동 점검: kubectl cluster-info"
            exit 1
          fi
          kubectl cluster-info --request-timeout=5s 2>/dev/null | head -1
          echo "[OK] 클러스터 접근 확인"

          echo ""
          echo "── 서비스 존재 확인 (namespace: ecommerce) ────────────────────"
          if kubectl get svc order-api-svc -n ecommerce &>/dev/null; then
            echo "[OK] svc/order-api-svc"
          else
            echo "[FAIL] svc/order-api-svc 를 ecommerce 네임스페이스에서 찾을 수 없습니다"
            echo "       수동 점검: kubectl get svc -n ecommerce"
            exit 1
          fi

      - name: Grant execute permission for address-http smoke script
        run: chmod +x scripts/smoke/e2e-order-address-http-smoke.sh

      - name: '[address-http] mock address-api 빌드 → http mode 검증 → stub 복원'
        run: |
          set -o pipefail
          bash scripts/smoke/e2e-order-address-http-smoke.sh 2>&1 | tee logs/smoke-address-http.log

      - name: 'smoke 결과 artifact 업로드'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs-address-http-${{ github.run_id }}
          path: logs/
          if-no-files-found: ignore
